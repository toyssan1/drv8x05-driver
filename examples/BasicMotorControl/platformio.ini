; PlatformIO Project Configuration — BasicMotorControl example
; https://docs.platformio.org/page/projectconf.html
;
; Demonstrates PH/EN full-bridge PWM control with the DRV8706S-Q1.
; Target board: ESP32 (change 'board' to match your hardware).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
src_dir = .
lib_deps =
    file://../..
