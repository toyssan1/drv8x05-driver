; PlatformIO Project Configuration — DualMotor example
; https://docs.platformio.org/page/projectconf.html
;
; Demonstrates dual full H-bridge control with the DRV8718S-Q1 / DRV8714S-Q1.
; Target board: ESP32 (change 'board' to match your hardware).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
src_dir = .
lib_deps =
    file://../..
build_flags =
    -DCS_PIN=5
    -DNSLEEP_PIN=14
    -DDRVOFF_PIN=27
    -DNFAULT_PIN=26
    -DIN1_PIN=25
    -DIN2_PIN=33
    -DIN3_PIN=32
    -DIN4_PIN=35
