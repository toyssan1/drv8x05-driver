; PlatformIO Project Configuration — FaultHandling example
; https://docs.platformio.org/page/projectconf.html
;
; Demonstrates nFAULT interrupt handling and SPI fault register readback.
; Target board: ESP32 (change 'board' to match your hardware).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
src_dir = .
lib_deps =
    file://../..
build_flags =
    -DCS_PIN=5
    -DNSLEEP_PIN=14
    -DDRVOFF_PIN=27
    -DNFAULT_PIN=26
    -DIN1_PIN=25
    -DIN2_PIN=33
    -DSPI_SCK_PIN=18
    -DSPI_MISO_PIN=19
    -DSPI_MOSI_PIN=23
