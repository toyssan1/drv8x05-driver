; PlatformIO Project Configuration — FaultHandling example
; https://docs.platformio.org/page/projectconf.html
;
; Demonstrates nFAULT interrupt handling and SPI fault register readback.
; Target board: ESP32 (change 'board' to match your hardware).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
src_dir = .
lib_deps =
    file://../..
